# Déploiement Cloudflare Workers (assets statiques).
# Pas d'URL *.workers.dev ni d'URL de preview : le site n'est servi que par
# la (ou les) route(s) de domaine personnalisé déclarée(s) ci-dessous.

name = "vuejs-assurance"
main = "worker/index.js"
compatibility_date = "2026-11-10"

workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* passe toujours par le Worker (synchronisation chiffrée), le reste par les assets.
run_worker_first = ["/api/*"]

# --- Synchronisation chiffrée (facultative) -----------------------------------
# Tant que le KV et le secret ne sont pas configurés, l'API répond « non
# configuré » et l'application fonctionne comme avant (100 % locale).
#
# 1. Créer l'espace KV puis coller son id ci-dessous :
#      npx wrangler kv namespace create SYNC_KV
# 2. Définir le jeton d'accès (longue chaîne aléatoire, ex. `openssl rand -base64 33`) :
#      npx wrangler secret put SYNC_TOKEN
# 3. Recommandé : placer le domaine derrière Cloudflare Access (Zero Trust).
#
# [[kv_namespaces]]
# binding = "SYNC_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Décommentez et adaptez pour publier sur votre domaine :
# routes = [
#   { pattern = "assurance.exemple.fr", custom_domain = true }
# ]
